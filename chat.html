<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevFest Maysan 2026 - Agent chat</title>
<style>
  :root {
    --navy: #141A2E; --navy-2: #1E2742; --paper: #F7F5EF; --card: #FFFFFF;
    --teal: #2E8B7A; --amber: #E0A33A; --ink: #1B2033; --muted: #6B7280;
    --line: #E3DFD3; --red: #B4483C;
    --sans: "IBM Plex Sans Arabic", "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    --mono: "JetBrains Mono", Consolas, "Cascadia Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 20px; line-height: 1.7;
         display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 700; }
  header .model { margin-inline-start: auto; font-family: var(--mono); font-size: 14px; color: #C9D1E6; direction: ltr; }
  header button { background: transparent; color: #fff; border: 1px solid #55607F; border-radius: 8px; padding: 6px 14px;
                  font: inherit; font-size: 15px; cursor: pointer; }
  header button:hover { border-color: var(--amber); color: var(--amber); }
  main { flex: 1; min-height: 0; display: flex; }
  #chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 12px 18px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-start; background: var(--navy); color: #fff; border-start-start-radius: 4px; }
  .answer { align-self: flex-end; background: var(--card); border: 1px solid var(--line); border-inline-start: 5px solid var(--teal);
            border-start-end-radius: 4px; }
  .tool, .approval { align-self: stretch; direction: ltr; text-align: left; font-family: var(--mono); font-size: 16px; line-height: 1.6;
          background: var(--navy-2); color: #E8ECF7; border-radius: 10px; padding: 12px 16px; overflow-wrap: anywhere; }
  .tool .label, .approval .label { color: var(--amber); font-weight: 700; }
  .tool .name { color: #7FD6C2; font-weight: 700; }
  .tool .result { color: #C9D1E6; }
  .tool .result.failed { color: #F0A79C; }
  .approval { border: 2px solid var(--amber); }
  .approval .buttons { margin-top: 10px; display: flex; gap: 10px; }
  .approval button { font: inherit; font-family: var(--sans); font-size: 17px; border: 0; border-radius: 8px; padding: 6px 22px; cursor: pointer; color: #fff; }
  .approval .yes { background: var(--teal); }
  .approval .no { background: var(--red); }
  .approval button:disabled { opacity: .45; cursor: default; }
  .info, .error { align-self: center; font-size: 15px; color: var(--muted); direction: ltr; font-family: var(--mono); text-align: center; }
  .error { color: var(--red); }
  .error button { margin-inline-start: 10px; font: inherit; border: 1px solid var(--red); background: transparent; color: var(--red);
                  border-radius: 6px; padding: 2px 12px; cursor: pointer; }
  .thinking { align-self: flex-end; color: var(--muted); font-size: 16px; }
  .thinking::after { content: "..."; animation: dots 1.2s steps(4, end) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.2em; } }
  #chips { padding: 0 24px 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  #chips button { font: inherit; font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
                  padding: 4px 14px; cursor: pointer; color: var(--ink); }
  #chips button:hover { border-color: var(--teal); color: var(--teal); }
  form { display: flex; gap: 10px; padding: 14px 24px 20px; border-top: 1px solid var(--line); background: var(--card); }
  #text { flex: 1; font: inherit; padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  #text:focus { outline: 2px solid var(--teal); border-color: transparent; }
  #send { font: inherit; font-weight: 700; background: var(--teal); color: #fff; border: 0; border-radius: 10px; padding: 0 26px; cursor: pointer; }
  #send:disabled, #text:disabled { opacity: .5; cursor: default; }
  aside { width: 330px; border-inline-start: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; }
  aside h2 { margin: 0; padding: 14px 18px; font-size: 16px; font-family: var(--mono); direction: ltr; text-align: left;
             border-bottom: 1px solid var(--line); color: var(--teal); }
  .files { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
  aside h2 + .files + h2 { border-top: 1px solid var(--line); }
  .note { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 16px; }
  .note b, .note span { display: block; }
  .note span { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 15px; }
  @media (max-width: 900px) { aside { display: none; } .msg { max-width: 94%; } }
</style>
</head>
<body>
<header>
  <h1>وكيل DevFest Maysan</h1>
  <span class="model" id="model"></span>
  <button id="reset" type="button">محادثة جديدة</button>
</header>
<main>
  <section id="chat">
    <div id="log" aria-live="polite"></div>
    <div id="chips">
      <button type="button">حوّل 500 دولار إلى الدينار واحفظها ملاحظة بعنوان مصاريف DevFest</button>
      <button type="button">كم سعر اليورو اليوم بالدينار؟</button>
      <button type="button">اجمع مصاريف DevFest وحوّلها إلى الدينار، وإذا تجاوزت مليون دينار فأرسل المجموع إلى المحاسب</button>
      <button type="button">كم سعر الجنيه الإسترليني بالدينار؟</button>
      <button type="button">شنو نتايجي بالدور الأول؟ وإذا أكو مادة تستاهل اعتراض گلّي</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="text" type="text" dir="auto" maxlength="2000" placeholder="اكتب مهمة للوكيل" aria-label="رسالة إلى الوكيل">
      <button id="send" type="submit">إرسال</button>
    </form>
  </section>
  <aside>
    <h2>notes.json</h2>
    <div id="notes" class="files"></div>
    <h2>outbox.json</h2>
    <div id="outbox" class="files"></div>
    <h2>appeals.json</h2>
    <div id="appeals" class="files"></div>
  </aside>
</main>
<script>
"use strict";
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("text");
const sendButton = document.getElementById("send");
const notesBox = document.getElementById("notes");
const outboxBox = document.getElementById("outbox");
const appealsBox = document.getElementById("appeals");
const modelLabel = document.getElementById("model");
let busy = false;
let thinking = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function add(node) {
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
  return node;
}

function setBusy(value, waitingForModel) {
  busy = value;
  input.disabled = value;
  sendButton.disabled = value;
  if (thinking) { thinking.remove(); thinking = null; }
  if (value && waitingForModel) thinking = add(el("div", "thinking", "الوكيل يفكر"));
  if (!value) input.focus();
}

// Model answers may use **bold**; render it without ever inserting HTML.
function richText(node, text) {
  text.split("**").forEach((part, i) => {
    if (!part) return;
    node.appendChild(i % 2 ? el("b", "", part) : document.createTextNode(part));
  });
}

// One panel per file a tool writes: newest record first, each line in its own direction.
function showRecords(box, records, headKey, bodyKey, emptyText) {
  box.textContent = "";
  if (!records.length) {
    box.appendChild(el("div", "empty", emptyText));
    return;
  }
  records.slice().reverse().forEach((record) => {
    const card = el("div", "note");
    const head = el("b", "", String(record[headKey] ?? ""));
    const body = el("span", "", String(record[bodyKey] ?? ""));
    head.dir = body.dir = "auto";
    card.append(head, body);
    box.appendChild(card);
  });
}

function showFiles(data) {
  showRecords(notesBox, data.notes || [], "title", "body", "لا ملاحظات محفوظة بعد.");
  showRecords(outboxBox, data.outbox || [], "to", "text", "لا رسائل بعد.");
  showRecords(appealsBox, data.appeals || [], "id", "course", "لا اعتراضات بعد.");
}

function showTool(event) {
  const card = el("div", "tool");
  card.appendChild(el("span", "label", "> "));
  card.appendChild(el("span", "name", event.name));
  card.appendChild(document.createTextNode(" " + JSON.stringify(event.arguments)));
  const failed = event.result && typeof event.result === "object" && "error" in event.result;
  card.appendChild(el("div", "result" + (failed ? " failed" : ""), "-> " + JSON.stringify(event.result)));
  add(card);
}

function showApproval(event) {
  const card = el("div", "approval");
  card.appendChild(el("span", "label", "Allow " + event.name + "? "));
  card.appendChild(document.createTextNode(JSON.stringify(event.arguments)));
  const buttons = el("div", "buttons");
  const yes = el("button", "yes", "موافق");
  const no = el("button", "no", "رفض");
  yes.type = no.type = "button";
  const answer = (allow) => {
    yes.disabled = no.disabled = true;
    card.appendChild(el("div", "label", allow ? "approved" : "declined"));
    run("/api/approve", { allow });
  };
  yes.addEventListener("click", () => answer(true));
  no.addEventListener("click", () => answer(false));
  buttons.append(yes, no);
  card.appendChild(buttons);
  add(card);
  yes.focus();
}

function showError(text, canRetry) {
  const row = el("div", "error", text);
  if (canRetry) {
    const retry = el("button", "", "retry");
    retry.type = "button";
    retry.addEventListener("click", () => { if (busy) return; retry.disabled = true; run("/api/continue", {}); });
    row.appendChild(retry);
  }
  add(row);
}

function render(event) {
  if (event.type === "tool") showTool(event);
  else if (event.type === "approval") showApproval(event);
  else if (event.type === "info") add(el("div", "info", event.text));
  else if (event.type === "error") showError(event.text, false);
  else if (event.type === "answer") {
    const bubble = el("div", "msg answer");
    bubble.dir = "auto";
    richText(bubble, event.text);
    add(bubble);
  }
}

async function call(path, body) {
  const response = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "request failed");
  return data;
}

// Drive the agent one step at a time so every tool call appears as it happens.
async function run(path, body) {
  setBusy(true, true);
  try {
    let data = await call(path, body);
    for (;;) {
      if (thinking) { thinking.remove(); thinking = null; }
      const failedBefore = data.state === "error";
      data.events.forEach((event) => {
        if (event.type === "error" && failedBefore) showError(event.text, true);
        else render(event);
      });
      modelLabel.textContent = data.model;
      showFiles(data);
      if (data.state !== "running") {
        setBusy(data.state === "approval", false);
        return;
      }
      thinking = add(el("div", "thinking", "الوكيل يفكر"));
      data = await call("/api/continue", {});
    }
  } catch (error) {
    showError("The page could not reach chat.py: " + error.message, false);
    setBusy(false, false);
  }
}

function send(text) {
  text = text.trim();
  if (!text || busy) return;
  const bubble = el("div", "msg user", text);
  bubble.dir = "auto";
  add(bubble);
  input.value = "";
  run("/api/chat", { text });
}

form.addEventListener("submit", (event) => { event.preventDefault(); send(input.value); });
document.querySelectorAll("#chips button").forEach((chip) => {
  chip.addEventListener("click", () => send(chip.textContent));
});
document.getElementById("reset").addEventListener("click", async () => {
  if (busy) return;
  const data = await call("/api/reset", {});
  log.textContent = "";
  showFiles(data);
  input.focus();
});

// A freshly loaded page starts a fresh conversation.
call("/api/reset", {}).then((data) => { modelLabel.textContent = data.model; showFiles(data); }).catch(() => {});
input.focus();
</script>
</body>
</html>
